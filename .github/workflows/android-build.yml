
name: Build AUDIOVIS Studio Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK packages, NDK and CMake
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # 5. Install Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. Verify Gradle installation
      - name: Verify Gradle
        run: |
          gradle --version

      # 7. Build debug APK
      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 8. Upload APK to GitHub Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUDIOVIS-Studio-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
